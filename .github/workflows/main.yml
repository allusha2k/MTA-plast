name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show structure
        run: |
          echo "=== Root Folder ==="
          ls -la
          echo "=== All Directories ==="
          find . -maxdepth 3 -not -path '*/.*'
